version: "3.8"

services:
  youbike-fetcher:
    build: .
    container_name: youbike_fetcher
    restart: unless-stopped
    environment:
      # 如果你的 MongoDB 在這台電腦本機上，請用 host.docker.internal
      # 如果是雲端 MongoDB Atlas，請貼上完整的 Connection String
      - MONGODB_URI=mongodb://host.docker.internal:27017
    extra_hosts:
      - "host.docker.internal:host-gateway" # 讓 Linux Docker 能連到本機
